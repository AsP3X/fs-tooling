# Human: GitHub Release for a version tag on master only. Not a branch push, not tags on other branches.
# Agent: TRIGGERS on refs/tags/vMAJOR.MINOR.PATCH. REQUIRES the tagged commit is on origin/master and package.json version matches the tag. WRITES one GitHub Release for that tag (does not mint a new tag).

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Workflow token is read-only by default; the job below opts into contents: write for the release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a version tag on master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a version tag (expected vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag '$TAG' is not on master. Releases only publish from master."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: npm ci && npm run build

      - name: Match package.json to the tag
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="${TAG#v}"
          if [[ "$version" != "$expected" ]]; then
            echo "::error::package.json version '$version' does not match tag '$TAG'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Freshservice Ops Panel ${{ steps.pkg.outputs.version }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/sth-extension.zip
            dist/sth-extension.tar.gz
            dist/freshservice-mod-dialog.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
