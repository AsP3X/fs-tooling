name: Build and release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: npm ci && npm run build

      - name: Read version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}-${{ github.run_number }}
          name: Freshservice Ops Panel ${{ steps.pkg.outputs.version }} (build ${{ github.run_number }})
          make_latest: true
          generate_release_notes: true
          files: |
            dist/sth-extension.zip
            dist/sth-extension.tar.gz
            dist/freshservice-mod-dialog.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
